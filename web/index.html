function parseSavedGame(raw, source) {
  if (!raw || typeof raw !== 'object') return null;
  if (raw.version !== 1 || !raw.storage || typeof raw.storage !== 'object') {
    console.warn(`[HubGame] ${source} 진행 데이터 형식이 올바르지 않습니다.`);
    return null;
  }
  return raw;
}

async function loadGame() {
  try {
    if (window.HubGame?.load) {
      const remote = parseSavedGame(await window.HubGame.load(HUB_SAVE_KEY), '원격');
      if (remote) return remote;
    }
  } catch (error) {
    console.warn('[HubGame] 원격 진행 불러오기에 실패했습니다. 로컬 저장본을 사용합니다.', error);
  }
  try {
    return parseSavedGame(JSON.parse(localStorage.getItem(hubLocalSaveKey) || 'null'), '로컬');
  } catch (error) {
    console.warn('[HubGame] 로컬 진행 데이터 파싱에 실패했습니다.', error);
    return null;
  }
}

function restoreGameState(savedGame) {
  GAME_STORAGE_KEYS.forEach(key => localStorage.removeItem(key));
  Object.entries(savedGame?.storage || {}).forEach(([key, value]) => {
    if (GAME_STORAGE_KEYS.includes(key) && typeof value === 'string') localStorage.setItem(key, value);
  });
}

const savedGame = await loadGame();
restoreGameState(savedGame);
let submittedLeaderboardStage = Number.isFinite(savedGame?.leaderboardStage)
  ? Math.max(0, Math.floor(savedGame.leaderboardStage)) : 0;
let pendingLeaderboardStage = Math.max(0, Math.floor(Number(localStorage.getItem(PENDING_LEADERBOARD_STAGE_STORAGE_KEY)) || 0));
if (pendingLeaderboardStage <= submittedLeaderboardStage) {
  pendingLeaderboardStage = 0;
  localStorage.removeItem(PENDING_LEADERBOARD_STAGE_STORAGE_KEY);
}

function createGameSnapshot() {
  return {
    version: 1,
    leaderboardStage: submittedLeaderboardStage,
    storage: Object.fromEntries(GAME_STORAGE_KEYS.map(key => [key, localStorage.getItem(key)])),
  };
}

let gameSaveTail = Promise.resolve();
function saveGame() {
  const snapshot = createGameSnapshot();
  localStorage.setItem(hubLocalSaveKey, JSON.stringify(snapshot));
  const save = gameSaveTail.then(async () => {
    try {
      if (window.HubGame?.save) await window.HubGame.save(HUB_SAVE_KEY, snapshot);
    } catch (error) {
      console.warn('[HubGame] 원격 진행 저장에 실패했습니다. 로컬 저장본을 사용합니다.', error);
    }
  });
  gameSaveTail = save.catch(() => {});
  return save;
}

let leaderboardSubmissionTail = Promise.resolve();
function submitStageLeaderboard(stage) {
  const value = Math.max(0, Math.floor(stage));
  if (value <= submittedLeaderboardStage) return Promise.resolve();
  pendingLeaderboardStage = Math.max(pendingLeaderboardStage, value);
  localStorage.setItem(PENDING_LEADERBOARD_STAGE_STORAGE_KEY, String(pendingLeaderboardStage));
  void saveGame();
  const submission = leaderboardSubmissionTail.then(async () => {
    const pending = pendingLeaderboardStage;
    if (!window.HubGame?.submitScore) return;
    try {
      await window.HubGame.submitScore(HUB_LEADERBOARD_KEY, pending);
      submittedLeaderboardStage = Math.max(submittedLeaderboardStage, pending);
      if (pendingLeaderboardStage <= pending) {
        pendingLeaderboardStage = 0;
        localStorage.removeItem(PENDING_LEADERBOARD_STAGE_STORAGE_KEY);
      }
      void saveGame();
    } catch (error) {
      console.warn('[HubGame] 리더보드 등록에 실패했습니다. 다음 실행 시 재시도합니다.', error);
    }
  });
  leaderboardSubmissionTail = submission.catch(() => {});
  return submission;
}
if (pendingLeaderboardStage > submittedLeaderboardStage) void submitStageLeaderboard(pendingLeaderboardStage);

async function renderLeaderboard(renderer) {
  if (!renderer && (!renderLeaderboard.cache || Date.now() - renderLeaderboard.loadedAt >= LEADERBOARD_REFRESH_MS)) {
    let board = [];
    try {
      if (window.HubGame?.getLeaderboard) {
        const remote = await window.HubGame.getLeaderboard(HUB_LEADERBOARD_KEY, 10);
        if (Array.isArray(remote)) board = remote;
      }
    } catch (error) {
      console.warn('[HubGame] 리더보드를 불러오지 못했습니다. 현재 플레이어 기록을 표시합니다.', error);
    }
    renderLeaderboard.cache = board.length ? board : [{ username: hubPlayerName, value: progress.getCurrentStage() }];
    renderLeaderboard.loadedAt = Date.now();
  }
  if (!renderer) return;
  const board = renderLeaderboard.cache || [{ username: hubPlayerName, value: progress.getCurrentStage() }];
  const template = renderer.getGroup('ramk1');
  if (!template?.parentElement) {
    console.warn('[HubGame] Ranking의 rank1 템플릿 그룹을 찾지 못했습니다.');
    return;
  }
  const rowData = board.slice(0, 7).map(({ username, value }) => ({
    name: username || '플레이어',
    stage: Math.max(0, Math.floor(Number(value) || 0)),

  renderer.update({ player: { stage1: String(rowData[0].stage), name1: rowData[0].name } });
  const parent = template.parentElement;
  parent.querySelectorAll('[data-runtime-leaderboard]').forEach(row => row.remove());
  [...parent.querySelectorAll(':scope > [data-group]')]
    .filter(row => row !== template && row.querySelector('[data-stable-id^="ranking-box-list"]'))

  // ponytail: authored Ranking panel fits 7 rows; add scrolling when all 10 rows must be visible.

    const row = template.cloneNode(true);
    const badge = row.querySelector('[data-stable-id="ranking-icon-1st-png-212"]');
    row.dataset.runtimeLeaderboard = '1';
    row.style.transform = `translateY(${(index + 1) * 91.2}px)`;

        'ranking-icon-1st-png-225',
        'ranking-icon-1st-png-236',

      ][index - 2]).cloneNode(true);
      rankNumber.style.top = badge.style.top;
      rankNumber.querySelector('.text-0').textContent = String(index + 2);
      row.appendChild(rankNumber);
    }
    parent.appendChild(row);
  });
}

  const request = new Request(input, init);
  const url = new URL(request.url);
  if (url.pathname === godotEnginePath || url.pathname === godotPackPath) {
    return nativeFetch(new Request(request, { cache: 'reload' }));
  }
  if (
    !splashCache
    || request.method !== 'GET'
    || request.headers.has('range')
    || url.origin !== location.origin
    || url.pathname.startsWith(uiPublishPath)
    || url.pathname.includes('/src/assets/')
    || !splashCacheablePath.test(url.pathname)
  ) {
    return nativeFetch(input, init);
  }
  const cached = await splashCache.match(request);
  if (cached) return cached;
  const response = await nativeFetch(request);
  if (response.ok) await splashCache.put(request, response.clone());
  return response;
};

};

function formatShopCooldown(ms) {
  const totalSeconds = Math.max(0, Math.ceil(ms / 1000));
  const hours = Math.floor(totalSeconds / 3600);
  const minutes = Math.floor((totalSeconds % 3600) / 60);
  const seconds = totalSeconds % 60;
  return [hours, minutes, seconds].map(v => String(v).padStart(2, '0')).join(':');
}

function getShopCooldownRemaining(productKey) {
  return Math.max(0, (Number(localStorage.getItem(SHOP_COOLDOWN_STORAGE_PREFIX + productKey)) || 0) - Date.now());
}

function setShopCooldown(productKey) {
  localStorage.setItem(SHOP_COOLDOWN_STORAGE_PREFIX + productKey, String(Date.now() + SHOP_PRODUCTS[productKey].cooldownMs));
  void saveGame();
}

function syncShopCooldowns(renderer) {
  Object.entries(SHOP_PRODUCTS).forEach(([productKey, product]) => {
    const remaining = getShopCooldownRemaining(productKey);
    product.active.forEach(stableId => {
      const el = renderer.getElement(stableId);
      if (el) el.style.display = remaining > 0 ? 'none' : '';
    });
    product.off.forEach(stableId => {
      const el = renderer.getElement(stableId);
      if (el) el.style.display = remaining > 0 ? '' : 'none';
    });
    const timer = renderer.getTextElement(product.timerText, 0);
    if (timer) {
      timer.textContent = formatShopCooldown(remaining);
      if (timer.dataset.gradText !== undefined) timer.dataset.gradText = timer.textContent;
    }
  });
}

function normalizeLobbyItemRewards(rewards = []) {
  const seen = new Set();
  return (Array.isArray(rewards) ? rewards : []).filter(reward => {
    const item = reward?.item;
    if (!ITEM_REWARD_UI[item] || seen.has(item)) return false;
    seen.add(item);
    return true;
  }).map(reward => ({ item: reward.item, count: 1 }));
}

function pickStageClearItemReward() {
  let roll = Math.random() * CLEAR_ITEM_REWARD_TABLE.reduce((sum, entry) => sum + entry.weight, 0);
  for (const entry of CLEAR_ITEM_REWARD_TABLE) {
    roll -= entry.weight;
    if (roll < 0) return entry.item;
  }
  return null;
}

function grantStageClearItemReward() {
  const item = pickStageClearItemReward();

}

function playLobbyItemReward(renderer, reward, onDone, playbackToken = lobbyRewardPlaybackToken) {
  const cfg = ITEM_REWARD_UI[reward?.item];
  if (!cfg) {
    onDone?.();
    return;
  }
  clearLobbyItemRewardLayers(renderer);
  setRewardLayers(renderer, cfg.lobbyLayers, true);
  const icon = renderer.getElement(cfg.lobbyIcon);
  const levelButton = renderer.getElement('home-btn-stage-normal-png-145');
  const iconImage = icon?.querySelector('img');
  if (!icon || !levelButton || !iconImage) {
    console.warn('[Item reward] Lobby reward layer not found:', reward.item);
    onDone?.();
    return;
  }
  const cachedStart = icon.getBoundingClientRect();
  const cachedEnd = levelButton.getBoundingClientRect();
  if (buttonSfxEnabled) sound.playSfx(LOBBY_REWARD_SCALE_SFX);
  icon.animate([
    { transform: 'scale(.75)' },
    { transform: 'scale(1.2)', offset: .55 },
    { transform: 'scale(1)' },
  ], { duration: 520, easing: 'cubic-bezier(0.22, 1, 0.36, 1)' });
  setTimeout(() => {
    const launchTrail = (attempt = 0) => {
      if (lobbyRewardPlaybackToken !== playbackToken || lobbyRewardPlaybackRenderer !== renderer) return;
      const liveStart = icon.getBoundingClientRect();
      const liveEnd = levelButton.getBoundingClientRect();
      const start = liveStart.width && liveStart.height ? liveStart : cachedStart;
      const end = liveEnd.width && liveEnd.height ? liveEnd : cachedEnd;
      let iconHidden = !start.width || !start.height;
      let buttonHidden = !end.width || !end.height;
      let node = liveStart.width && liveStart.height ? icon : null;
      while (!iconHidden && node instanceof HTMLElement) {
        const style = getComputedStyle(node);
        iconHidden = style.display === 'none' || style.visibility === 'hidden' || Number(style.opacity) <= 0;
        node = node.parentElement;
      }
      node = liveEnd.width && liveEnd.height ? levelButton : null;
      while (!buttonHidden && node instanceof HTMLElement) {
        const style = getComputedStyle(node);
        buttonHidden = style.display === 'none' || style.visibility === 'hidden' || Number(style.opacity) <= 0;
        node = node.parentElement;
      }
      if (iconHidden || buttonHidden) {
        if (attempt < 12) {
          requestAnimationFrame(() => launchTrail(attempt + 1));
          return;
        }
        console.warn('[Item reward] Lobby reward trail launch skipped:', reward.item);
        clearLobbyItemRewardLayers(renderer);
        onDone?.();
        return;
      }
      clearLobbyItemRewardLayers(renderer);
      if (buttonSfxEnabled) sound.playSfx(LOBBY_REWARD_TRAIL_SFX);
      const startX = start.left + start.width / 2;
      const startY = start.top + start.height / 2;
      const endX = end.left + end.width / 2;
      const endY = end.top + end.height / 2;
      const shardWidth = Math.max(1, start.width * 0.5);
      const shardHeight = Math.max(1, start.height * 0.5);
      for (let i = 0; i < LOBBY_REWARD_TRAIL_COUNT; i += 1) {
        const shard = document.createElement('img');
        shard.src = iconImage.src;
        shard.alt = '';
        shard.style.cssText = `position:fixed;left:${startX}px;top:${startY}px;width:${shardWidth}px;height:${shardHeight}px;z-index:10000;pointer-events:none;object-fit:contain;`;
        document.body.appendChild(shard);
        const spread = (i - (LOBBY_REWARD_TRAIL_COUNT - 1) / 2) * 8;
        const lift = i % 2 ? -34 : -20;
        const curve = Array.from({ length: 7 }, (_, step) => {
          const t = step / 6;
          const x = (endX - startX) * t + spread * Math.sin(Math.PI * t);
          const y = (endY - startY) * t + lift * 4 * t * (1 - t);
          return {
            transform: `translate(calc(-50% + ${x}px), calc(-50% + ${y}px)) scale(${1 - 0.65 * t})`,
            opacity: 1 - t,
          };
        });
        const anim = shard.animate(curve, { duration: 720, delay: i * 55, easing: 'cubic-bezier(0.22, 1, 0.36, 1)', fill: 'forwards' });
        anim.onfinish = () => shard.remove();
      }
      setTimeout(() => {
        if (lobbyRewardPlaybackToken !== playbackToken || lobbyRewardPlaybackRenderer !== renderer) return;
        clearLobbyItemRewardLayers(renderer);
        onDone?.();
      }, 720 + Math.max(0, (LOBBY_REWARD_TRAIL_COUNT - 1) * 55) + 40);
    };
    launchTrail();
  }, 800);
}

function playQueuedLobbyItemRewards(renderer) {
  pendingLobbyItemRewards = normalizeLobbyItemRewards([...pendingLobbyItemRewards, ...readPendingLobbyItemRewards()]);
  savePendingLobbyItemRewards();
  if (!pendingLobbyItemRewards.length) return;
  if (lobbyRewardPlaybackRenderer) return;
  const playbackToken = ++lobbyRewardPlaybackToken;
  lobbyRewardPlaybackRenderer = renderer;
  let attempts = 0;
  const playWhenVisible = () => {
    if (lobbyRewardPlaybackToken !== playbackToken || lobbyRewardPlaybackRenderer !== renderer) return;
    const levelButton = renderer.getElement('home-btn-stage-normal-png-145');
    const rect = levelButton?.getBoundingClientRect();
    let hidden = !levelButton?.isConnected || !rect?.width || !rect?.height;
    let node = levelButton;
    while (!hidden && node instanceof HTMLElement) {
      const style = getComputedStyle(node);
      hidden = style.display === 'none' || style.visibility === 'hidden' || Number(style.opacity) <= 0;
      node = node.parentElement;
    }
    if (hidden) {
      if (attempts++ < 30) setTimeout(playWhenVisible, 100);
      else if (lobbyRewardPlaybackToken === playbackToken) lobbyRewardPlaybackRenderer = null;
      return;
    }
    const rewards = pendingLobbyItemRewards.splice(0);
    savePendingLobbyItemRewards();
    const next = () => {
      if (lobbyRewardPlaybackToken !== playbackToken || lobbyRewardPlaybackRenderer !== renderer) return;
      const reward = rewards.shift();
      if (reward) playLobbyItemReward(renderer, reward, next, playbackToken);
      else if (lobbyRewardPlaybackToken === playbackToken) lobbyRewardPlaybackRenderer = null;
    };
    next();
  };
  requestAnimationFrame(() => requestAnimationFrame(playWhenVisible));
}

    renderer.on('widget:itme3', ({ value }) => {
      playButtonClickSfx();
      if (value) requestItem('move');
      else cancelItemSelection();
    });
    ['entry-item-num-png-2470', 'entry-item-num-png-2474'].forEach((stableId) => {
      const el = renderer.getElement(stableId);
      if (!el || el.dataset.itemCancelBound === '1') return;
      el.dataset.itemCancelBound = '1';
      el.style.cursor = 'pointer';
      el.style.pointerEvents = 'auto';
      el.addEventListener('click', (event) => {
        if (!selectedTargetItem) return;
        event.preventDefault();
        event.stopPropagation();
        cancelItemSelection();
      });
    });
    ['entry-box-normal-png-2458', 'home-btn-setting-webp-2467'].forEach((stableId) => {
      const el = renderer.getElement(stableId);
      if (!el || el.dataset.ingameSettingsSfxBound === '1') return;
      el.dataset.ingameSettingsSfxBound = '1';
      el.addEventListener('click', () => {
        playButtonClickSfx();
      });
    });
    ['entry-box-normal-png-2456', 'item2-png-2461', 'common-icon-greendot2-webp-2464'].forEach((stableId) => {
      const el = renderer.getElement(stableId);
      if (!el || el.dataset.itemTimestopBound === '1') return;
      el.dataset.itemTimestopBound = '1';
      el.style.cursor = 'pointer';
      el.style.pointerEvents = 'auto';
      el.addEventListener('click', () => {
        if (buttonSfxEnabled) sound.playSfx(BUTTON_CLICK_SFX);
        requestItem('timestop');
      });
    });
    if (ingameBgmEnabled) sound.playBgm(INGAME_BGM);
    else sound.stopBgm();
  }
  if (sceneName === 'pop_BuyCoins') {
    const purchaseToast = renderer.getElement('common-box-toast-png-2187');
    const closeButton = renderer.getElement('common-btn-top-x-blue-png-2186');
    let purchaseToastTimer;
    let resumeTimeoutAfterShop = false;
    if (purchaseToast) purchaseToast.style.visibility = 'hidden';
    if (closeButton) {
      closeButton.style.visibility = popup ? '' : 'hidden';
      closeButton.style.pointerEvents = popup ? '' : 'none';
    }
    syncShopCooldowns(renderer);
    const shopCooldownAnchor = renderer.getElement('plain-text-50');
    const shopCooldownTimer = setInterval(() => {
      if (!shopCooldownAnchor?.isConnected) {
        clearInterval(shopCooldownTimer);
        return;
      }
      syncShopCooldowns(renderer);
    }, 1000);
    const showPurchaseToast = () => {
      resumeTimeoutAfterShop = timeoutRecoveryPending && endedGame === activeGame && activeGame?.state === 'paused';
      console.info('[timeout-shop] purchase completed', { resumeTimeoutAfterShop, gameState: activeGame?.state });
      if (!purchaseToast) return;
      clearTimeout(purchaseToastTimer);
      purchaseToast.style.visibility = '';
      purchaseToastTimer = setTimeout(() => { purchaseToast.style.visibility = 'hidden'; }, 2500);
    };
    renderer.on('common-btn-top-x-blue-png-2186:click', () => {
      if (!resumeTimeoutAfterShop || activeGame?.state !== 'paused') return;
      resumeTimeoutAfterShop = false;
      timeoutRecoveryPending = false;
      endedGame = null;
      console.info('[timeout-shop] resuming purchased timeout continue', { timeLimitSeconds: TIMEOUT_CONTINUE_SECONDS });
      activeGame.message('continue_stage', { timeLimitSeconds: TIMEOUT_CONTINUE_SECONDS });
      activeGame.resume();
    });
    renderer.on('860', async () => {
      if (shopPurchasePending || getShopCooldownRemaining('860') > 0) return;
      shopPurchasePending = true;
      try {
        await runEconomyTransaction('shop-purchase', async () => {
          await economy.grantCoins(5000, 'shop-860');
          await economy.refillHearts();
          activateUnlimitedHearts();
        });
        setShopCooldown('860');
        syncShopCooldowns(renderer);
        showPurchaseToast();
      } finally {
        shopPurchasePending = false;
      }
    });
    renderer.on('480', async () => {
      if (shopPurchasePending || getShopCooldownRemaining('480') > 0) return;
      shopPurchasePending = true;
      try {
        await runEconomyTransaction('shop-purchase', async () => {
          await economy.grantCoins(2500, 'shop-480');
          await economy.grantHearts(10, Date.now(), 'shop-480', { overflowCap: 10 });
        });
        setShopCooldown('480');
        syncShopCooldowns(renderer);
        showPurchaseToast();
      } finally {
        shopPurchasePending = false;
      }
    });
    renderer.on('320', async () => {
      if (shopPurchasePending || getShopCooldownRemaining('320') > 0) return;
      shopPurchasePending = true;
      try {
        await runEconomyTransaction('shop-purchase', () => economy.grantCoins(1000, 'shop-320'));
        setShopCooldown('320');
        syncShopCooldowns(renderer);
        showPurchaseToast();
      } finally {
        shopPurchasePending = false;
      }
    });
  }
  if (sceneName === 'pop_LevelFail' && popup) {
    const closeButton = renderer.getElement('common-btn-top-x-red-png-2350');
    if (closeButton && closeButton.dataset.popupCloseBound !== '1') {
      closeButton.dataset.popupCloseBound = '1';
      closeButton.style.cursor = 'pointer';
      closeButton.style.pointerEvents = 'auto';
      closeButton.addEventListener('click', async (event) => {
        event.preventDefault();
        event.stopPropagation();
        await flow.closePopup();
        if (activeGame?.state === 'paused') activeGame.resume();
      });
    }
  }
  if (sceneName === 'pop_LevelWin' && popup) {
    if (buttonSfxEnabled) {
      sound.playSfx(STAGE_CLEAR1_SFX);
      setTimeout(() => sound.playSfx(STAGE_CLEAR2_SFX), STAGE_CLEAR2_DELAY_MS);
    }
    renderer.getElement('confetti-148')?.style.setProperty('pointer-events', 'none');
    renderer.getElement('confetti-148')?.closest('.sr-fit')?.style.setProperty('z-index', '9001');
    syncLevelWinItemReward(renderer, levelWinItemReward);
    if (activeGame?.state === 'running') activeGame.pause('level-win');
    activeGame?.message('load_scene', {
      stage: progress.getCurrentStage(),
      config: { godotScene: 'main', timeLimitSeconds: STAGE_TIME_LIMIT_SECONDS },
    });
  }
  if (sceneName === 'pop_OutOfMoves' && popup) {
    if (buttonSfxEnabled) sound.playSfx(TIME_OUT_SFX);
    if (activeGame?.state === 'running') activeGame.pause('out-of-moves');
    ['plain-text-1774', 'itemicon-money-coin-png-1773'].forEach((stableId) => {
      const el = renderer.getElement(stableId);
      if (!el) return;
      el.style.pointerEvents = 'none';
    });
  } else if (sceneName === 'pop_Give_up' && popup) {
    if (activeGame?.state === 'running') activeGame.pause('give-up');
    renderer.on('common-btn-green-sales-png-2379:click', () => {
      if (!hasUnlimitedHearts()) void runEconomyTransaction('give-up-heart', () => economy.consumeHeart());
    });
    ['plain-text-2382:click', 'common-btn-top-x-red-png-2384:click'].forEach(eventName => {
      renderer.on(eventName, () => activeGame?.resume());
    });
  } else if (popup && buttonSfxEnabled) {
    sound.playSfx(POPUP_OPEN_SFX);
  }
  if ((sceneName === 'pop_Settings_1' || sceneName === 'pop_Settings') && popup) {
    if (activeGame?.state === 'running') activeGame.pause('settings');
    const isLobbySettings = sceneName === 'pop_Settings';
    const isIngameSettings = sceneName === 'pop_Settings_1';
    renderer.update({
      sound: isIngameSettings ? ingameBgmEnabled : buttonSfxEnabled,
      music: isLobbySettings ? lobbyBgmEnabled : buttonSfxEnabled,
      vibration: hapticsEnabled,
    });
    renderer.on('widget:sound', ({ value }) => {
      if (isIngameSettings) {
        ingameBgmEnabled = !!value;
        if (ingameBgmEnabled) sound.playBgm(INGAME_BGM);
        else sound.stopBgm();
        renderer.update({ sound: ingameBgmEnabled });
        return;
      }
      buttonSfxEnabled = !!value;
      if (!buttonSfxEnabled) {
        sound.stopSfx('cat-mouth-open');
        sound.stopSfx('cat-hole-absorb');
      }
      renderer.update({ sound: buttonSfxEnabled });
    });
    renderer.on('widget:music', ({ value }) => {
      if (isIngameSettings) {
        buttonSfxEnabled = !!value;
        if (!buttonSfxEnabled) {
          sound.stopSfx('cat-mouth-open');
          sound.stopSfx('cat-hole-absorb');
        }
        renderer.update({ music: buttonSfxEnabled });
      } else {
        lobbyBgmEnabled = !!value;
        if (lobbyBgmEnabled) sound.playBgm(LOBBY_BGM);
        else sound.stopBgm();
        renderer.update({ music: lobbyBgmEnabled });
      }
    });
    renderer.on('widget:vibration', ({ value }) => {
      hapticsEnabled = !!value;
      if (hapticsEnabled) navigator.vibrate?.(12);
      else navigator.vibrate?.(0);
      renderer.update({ vibration: hapticsEnabled });
    });
    const menuMotionTargets = sceneName === 'pop_Settings_1'
      ? SETTINGS_MENU_GROUPS.map(({ name, offset, layerIds }) => ({
          offset,
          targets: layerIds
            ? layerIds.map(stableId => renderer.getElement(stableId)).filter(Boolean)
            : [renderer.getGroup(name)].filter(Boolean),
        }))
      : [];
    ['entry-box-normal-png-2287', 'home-btn-setting-webp-2288'].forEach(stableId => {
      const closeButton = renderer.getElement(stableId);
      if (!closeButton) return;
      ['mousedown', 'mouseup', 'mouseleave', 'touchstart', 'touchend'].forEach(eventName => {
        closeButton.addEventListener(eventName, event => event.stopPropagation());
      });
    });
    const popupSettingsFx = renderer.getElement('entry-box-normal-png-2287')?.closest('[data-fx-group]');
    const popupSettingsGroup = renderer.getGroup('setting');
    menuMotionTargets.forEach(({ offset, targets }, index) => {
      const translate = `translateY(${offset}px)`;
      targets.forEach(target => {
        target.style.transform = translate;
        target.animate(
          [{ transform: translate }, { transform: 'translateY(0)' }],
          {
            duration: SETTINGS_MENU_MOTION_MS,
            delay: index * SETTINGS_MENU_STAGGER_MS,
            easing: 'cubic-bezier(0.22, 1, 0.36, 1)',
            fill: 'forwards',
          },
        );
      });
    });
    ['entry-box-normal-png-2287', 'home-btn-setting-webp-2288'].forEach((stableId) => {
      const closeButton = renderer.getElement(stableId);
      if (!closeButton || closeButton.dataset.settingsCloseBound === '1') return;
      closeButton.dataset.settingsCloseBound = '1';
      closeButton.addEventListener('click', async (event) => {
        event.preventDefault();
        event.stopPropagation();
        if (buttonSfxEnabled) sound.playSfx(BUTTON_CLICK_SFX);
        popupSettingsFx?.animate(
          [
            { transform: 'scale(1)', filter: 'brightness(1)' },
            { transform: 'scale(.95)', filter: 'brightness(.95)' },
            { transform: 'scale(1)', filter: 'brightness(1)' },
          ],
          { duration: 100, easing: 'ease-out' },
        );
        [...menuMotionTargets].reverse().forEach(({ offset, targets }, index) => {
          targets.forEach(target => target.animate(
            [{ transform: 'translateY(0)' }, { transform: `translateY(${offset}px)` }],
            {
              duration: SETTINGS_MENU_MOTION_MS,
              delay: index * SETTINGS_MENU_STAGGER_MS,
              easing: 'cubic-bezier(0.4, 0, 1, 1)',
              fill: 'forwards',
            },
          ));
        });
        setTimeout(() => {
          menuMotionTargets.forEach(({ targets }) => {
            targets.forEach(target => target.style.setProperty('visibility', 'hidden'));
          });
          popupSettingsGroup?.style.setProperty('visibility', 'hidden');
        }, SETTINGS_MENU_MOTION_MS + SETTINGS_MENU_STAGGER_MS * (SETTINGS_MENU_GROUPS.length - 1));
        await new Promise(resolve => setTimeout(resolve, SETTINGS_MENU_MOTION_MS + SETTINGS_MENU_STAGGER_MS * SETTINGS_MENU_GROUPS.length + 20));
        await flow.closePopup();
        if (activeGame?.state === 'paused') activeGame.resume();
      });
    });
    return;
  }
  if (sceneName === INGAME_UI_SCENE) {
    renderer.getGroup('setting')?.style.removeProperty('visibility');
  }
  if (sceneUuid === SPLASH_UI_SCENE_UUID) {
    splashRenderer = renderer;
    renderer.getElementByName('GameField')?.style.setProperty('visibility', 'hidden');
    flow.update({ loadingMessage: '파일 다운로드 중입니다...' });
    await uiRenderStylesReady;
    if (splashCache) {
      await Promise.all([
        fetch(GODOT_ENGINE_URL),
        fetch(`${GODOT_CONFIG.executable}.wasm`),
        fetch(GODOT_CONFIG.mainPack || `${GODOT_CONFIG.executable}.pck`),
      ]);
    }
    if (document.fonts?.load && UI_FONT_SPECS.size) {
      await Promise.all([...UI_FONT_SPECS].map(spec => document.fonts.load(spec).catch(() => null)));
    }
    const navigationTabPreload = Promise.all([...new Set([
      ...NAVIGATION_TAB_SCENES.flatMap(sceneName => {
        const contract = sceneContracts.get(sceneName);
        if (!contract) throw new Error(`[Splash preload] 네비게이션 탭 contract 누락: ${sceneName}`);
        return [...JSON.stringify(contract).matchAll(/"(?:imagePath|exportPath|iconPath|iconActivePath)"\s*:\s*"([^"]+\.(?:png|jpe?g|webp|svg))"/gi)].map(([, path]) => path);
      }),
      ...sceneFlow.edges.flatMap(({ transitionIn }) => (transitionIn?.curtainLayers || [])
        .map(({ visual }) => visual?.exportPath).filter(Boolean)),
    ])].map(path => new Promise((resolve, reject) => {
      const image = new Image();
      navigationTabImages.push(image);
      image.onload = () => image.decode ? image.decode().then(resolve, reject) : resolve();
      image.onerror = () => reject(new Error(`[Splash preload] 네비게이션 에셋 로드 실패: ${path}`));
      image.src = ASSET_BASE + path;
    })));
    const audioPreload = Promise.all(AUDIO_ASSETS.map(async path => {
      const response = await fetch(path);
      if (!response.ok) throw new Error(`[Splash preload] 오디오 에셋 로드 실패(${response.status}): ${path}`);
      await response.arrayBuffer();
    }));
    const game = new GameSession({ renderer, initTimeoutMs: 30000 });
    activeGame = game;
    await Promise.all([
      navigationTabPreload,
      audioPreload,
      renderLeaderboard(),
      game.start(godotCartridge, {
        stage: progress.getCurrentStage(),
        config: { godotScene: 'lobby', preloadGodotScenes: ['main'] },
        onProgress: handleGodotSfx,
        onHud: ({ timeLeft }) => flow.update({ stage: { timer: timeLeft } }),
        onEnd: handleMainGameEnd,
        onError: (error) => console.error('[Godot preload] session error', error),
      }),
    ]);
    if (activeGame !== game || game.state !== 'ready') {
      throw new Error('[Godot preload] Lobby/Main 준비에 실패했습니다.');
    }
    const gameHost = document.getElementById('godot-bridge-canvas')?.parentElement;
    const parking = document.getElementById('godot-bridge-parking') || document.createElement('div');
    parking.id = 'godot-bridge-parking';
    parking.style.cssText = 'display:none;';
    if (!parking.isConnected) document.body.appendChild(parking);
    if (gameHost) parking.appendChild(gameHost);
    loadingReady = true;
    const fillStartedAt = performance.now();
    while (true) {
      const percent = Math.min(100, Math.round((performance.now() - fillStartedAt) / SPLASH_LOAD_FILL_DURATION_MS * 100));
      flow.update({ loading: { prograss: percent }, loadingMessage: `Loading... ${percent}%` });
      if (percent === 100) break;
      await new Promise(resolve => requestAnimationFrame(resolve));
    }
    flow.update({ loadingMessage: 'Tap to screen' });
    return;
  }
  if (!godotScene) {
    if (!popup && gameHost && parking) parking.appendChild(gameHost);
    return;
  }
  const gameField = renderer.getElementByName('GameField');
  if (gameHost && gameField) {
    gameHost.style.cssText = 'position:absolute;inset:0;overflow:hidden;display:block;';
    gameField.appendChild(gameHost);
    requestAnimationFrame(() => console.info('[Godot mount]', JSON.stringify({
      sceneName,
      scene: godotScene,
      canvasPixels: [gameHost.firstElementChild?.width, gameHost.firstElementChild?.height],
      host: gameHost.getBoundingClientRect().toJSON(),
      gameField: gameField.getBoundingClientRect().toJSON(),
      parent: gameHost.parentElement?.getAttribute('data-stable-id'),
    })));
  } else {
    console.error('[Godot mount] 대상 누락', { sceneName, scene: godotScene, gameHost: !!gameHost, gameField: !!gameField });
  }
  if (activeGame?.state === 'running' && godotScene === activeGodotScene) return;
  if (activeGame?.state === 'running') activeGame.pause('scene-switch');
  if (activeGame?.state === 'paused') {
    const restartingTimedOutStage = godotScene === 'main' && timeoutRecoveryPending && endedGame === activeGame && !continueWithoutHeart;
    if (godotScene === 'main') {
      endedGame = null;
      timeoutRecoveryPending = false;
    }
    if (godotScene === 'main' && continueWithoutHeart) {
      activeGame.message('continue_stage', { timeLimitSeconds: TIMEOUT_CONTINUE_SECONDS });
      continueWithoutHeart = false;
    }
    if (godotScene !== activeGodotScene || restartingTimedOutStage) {
      if (restartingTimedOutStage) console.info('[timeout-replay] restarting ended stage after shop return');
      activeGodotScene = godotScene;
      activeGame.message('load_scene', {
        stage: progress.getCurrentStage(),
        config: { godotScene, ...(godotScene === 'main' ? { timeLimitSeconds: STAGE_TIME_LIMIT_SECONDS } : {}) },
      });
    }
    activeGame.resume();
    return;
  }
  if (activeGame?.state === 'ready') {
    if (godotScene === activeGodotScene) return;
    if (godotScene === 'main') {
      if (!continueWithoutHeart && !hasUnlimitedHearts() && !(await runEconomyTransaction('game-entry-heart', () => economy.consumeHeart()))) {
        throw new Error('[Economy] Ingame 진입 전 하트 소비에 실패했습니다. no_heart 흐름도 분기를 확인하세요.');
      }
      continueWithoutHeart = false;
      const sceneReadyPromise = new Promise(resolve => {
        pendingSceneReady = { scene: godotScene, resolve: () => { pendingSceneReady = null; resolve(); } };
      });
      activeGame.message('load_scene', {
        stage: currentMapStage,
        config: { godotScene, timeLimitSeconds: STAGE_TIME_LIMIT_SECONDS },
      });
      activeGodotScene = godotScene;
      activeGame.startGame();
      await sceneReadyPromise;
      return;
    }
  }
  const sessionToken = ++sceneSessionToken;

  if (godotScene === 'main' && !continueWithoutHeart && !hasUnlimitedHearts()) {
    const consumedHeart = await runEconomyTransaction('game-entry-heart', () => economy.consumeHeart());
    if (sessionToken !== sceneSessionToken) return;
    if (!consumedHeart) {
      throw new Error('[Economy] Ingame 진입 전 하트 소비에 실패했습니다. no_heart 흐름도 분기를 확인하세요.');
    }
  }
  if (sessionToken !== sceneSessionToken) return;
  continueWithoutHeart = false;

  if (activeGame) activeGame.abort('scene-change');
  const game = new GameSession({ renderer, initTimeoutMs: 30000, hudMap: { timeLeft: 'stage.timer' } });
  activeGame = game;
  activeGodotScene = godotScene;
  await game.start(godotCartridge, {
    stage: currentMapStage,
    config: { godotScene, ...(godotScene === 'main' ? { timeLimitSeconds: STAGE_TIME_LIMIT_SECONDS } : {}) },
    onEnd: handleMainGameEnd,
    onProgress: handleGodotSfx,
    onError: (error) => console.error('[Godot integration] session error', error),
  });
  if (sessionToken !== sceneSessionToken || activeGame !== game) {
    game.abort('stale-scene-enter');
    return;
  }
  if (game.state === 'ready') game.startGame();
  })();
  waitUntil?.(enterWork);
});

await flow.start();
</script>
</body>
</html>
