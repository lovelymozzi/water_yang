<html lang="ko">

<body>
<script type="module">
const UI_DIR = './ui/';
const ASSET_BASE = '../';
const STORAGE_PREFIX = 'leonout_';
const SPLASH_UI_SCENE_UUID = 'c4e72c62-dadd-40ab-85f4-bd397f4ca7f9';
const LOBBY_NAV_SCENE_UUID = '37f376d8-4e32-4340-9bbd-4ed17767e148';
const LOBBY_UI_SCENE = 'Lobby';
const INGAME_UI_SCENE = 'Ingame';
const COIN_COST = 900;
const INITIAL_COINS = 500;
const INITIAL_COIN_GRANT_STORAGE_KEY = STORAGE_PREFIX + 'initial_coin_grant_v1';
const MAX_HEARTS = 5;
const UNLIMITED_HEARTS_DURATION_MS = 60 * 60 * 1000;
const UNLIMITED_HEARTS_STORAGE_KEY = STORAGE_PREFIX + 'unlimited_hearts_until';
const SHOP_COOLDOWN_STORAGE_PREFIX = STORAGE_PREFIX + 'shop_cooldown_until_';
const SHOP_PRODUCTS = {
  860: {
    cooldownMs: 24 * 60 * 60 * 1000,
    active: ['ingame-toggle-on-png-167', 'text-860jpy-174'],
    off: ['ingame-toggle-on-png-2483', 'text-860jpy-2485'],
    timerText: 'plain-text-50',
  },
  480: {
    cooldownMs: 24 * 60 * 60 * 1000,
    active: ['ingame-toggle-on-png-178', 'text-860jpy-180'],
    off: ['ingame-toggle-on-png-2487', 'text-860jpy-2489'],
    timerText: 'plain-text-2499',
  },
  320: {
    cooldownMs: 60 * 60 * 1000,
    active: ['ingame-toggle-on-png-182', 'text-860jpy-184'],
    off: ['ingame-toggle-on-png-2506', 'text-860jpy-2508'],
    timerText: 'plain-text-2504',
  },
};
const DEFAULT_HEART_ICON = 'src/assets/icon_heart_2.png';
const EVENT_HEART_ICON = 'src/assets/event_icon_skkycupheart.webp?v=860-unlimited-v2';
const STAGE_CLEAR_REWARD = 40;
const AD_STAGE_CLEAR_REWARD = 80;
const ITEM_START_COUNT = 3;
const BUTTON_CLICK_SFX = './sound/Ui_button_sound.mp3';
const CAT_MOUTH_SFX = './sound/Cat_meow.mp3';
const CAT_HOLE_ABSORB_SFX = './sound/cat_Hole_sound.mp3';
const ITEM_MOVE_HOLE_POP_SFX = './sound/bubble_pop.mp3';
const CAT_MOVE_SFX = './sound/cat_move.mp3';
const ICE_BREAK_SFX = './sound/ice_breake.mp3';
const ICE_FREEZING_SFX = './sound/ice-freezing.mp3';
const DIGGING_SFX = './sound/diggingt_optimized.mp3';
const STAGE_CLEAR1_SFX = './sound/stage_clear1.mp3';
const STAGE_CLEAR2_SFX = './sound/stage_clear2.mp3';
const TIME_OUT_SFX = './sound/time_out1.mp3';
const POPUP_OPEN_SFX = './sound/ui_pop.mp3';
const STAGE_CLEAR2_DELAY_MS = 750;
const LOBBY_BGM = './sound/Lobby_Bgm.mp3';
const INGAME_BGM = './sound/Ingame_BGM.mp3';
const STAGE_TIME_LIMIT_SECONDS = 60;
const SPLASH_LOAD_FILL_DURATION_MS = 700;
const SETTINGS_MENU_MOTION_MS = 240;
const SETTINGS_MENU_STAGGER_MS = 60;
const SETTINGS_MENU_GROUPS = [
  { name: 'Music', offset: 86 },
  { name: 'Sound', offset: 159 },
  { name: 'Vibration', offset: 232 },
  {
    offset: 305,
    layerIds: [
      'setting-btn-option-png-2245',
      'back-off-png-2278',
      'back-on-png-2277',
    ],
  },
  { name: 'retry', offset: 377 },
];
const GODOT_ENGINE_URL = "index.js";
const GODOT_CONFIG = { ...{"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":18926640,"index.wasm":39513091},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4}, unloadAfterInit: false };

import { FlowDriver } from './ui/flow-driver.js?v=heart-layer-v3';
import { EconomyManager } from './ui/economy-manager.js?v=heart-display-v4';
import { ProgressManager } from './ui/progress-manager.js';
import { GameSession } from './ui/game-session.js';
import { makeGodotCartridge } from './ui/godot-bridge.js';
import { SoundManager } from './ui/sound-manager.js';

const SPLASH_CACHE_NAME = `${STORAGE_PREFIX}splash_load_${GODOT_CONFIG.fileSizes?.[`${GODOT_CONFIG.executable}.pck`] || 'v1'}`;
const splashCache = 'caches' in window ? await caches.open(SPLASH_CACHE_NAME) : null;
const nativeFetch = window.fetch.bind(window);
const splashCacheablePath = /\.(pck|wasm|js|json|png|jpe?g|webp|mp3|ogg|wav|woff2)$/i;
const uiPublishPath = new URL(UI_DIR, location.href).pathname;
if (splashCache) {
  await navigator.storage?.persist?.();
  window.fetch = async (input, init) => {
    const request = new Request(input, init);
    const url = new URL(request.url);
    if (
      request.method !== 'GET'
      || request.headers.has('range')
      || url.origin !== location.origin
      || url.pathname.startsWith(uiPublishPath)
      || url.pathname.includes('/src/assets/')
      || !splashCacheablePath.test(url.pathname)
    ) {
      return nativeFetch(input, init);
    }
    const cached = await splashCache.match(request);
    if (cached) return cached;
    const response = await nativeFetch(request);
    if (response.ok) await splashCache.put(request, response.clone());
    return response;
  };
} else {
  console.warn('[Splash cache] Cache API를 사용할 수 없어 splash 로딩 데이터를 기기에 저장하지 못합니다.');
}

const CLICK_EVENT_STABLE_IDS = new Set();
const UI_FONT_SPECS = new Set();
const uiRenderStylesReady = Promise.all([
  ['scene-renderer-editor-fonts', `${UI_DIR}vendor/fonts/fonts.css`],
  ['ui-css-effect-provider-animate-css', `${UI_DIR}vendor/animate.min.css`],
].map(([id, href]) => new Promise(resolve => {
  const link = document.getElementById(id) || document.createElement('link');
  link.id = id;
  link.rel = 'stylesheet';
  link.addEventListener('load', resolve, { once: true });
  link.addEventListener('error', resolve, { once: true });
  if (!link.isConnected) {
    link.href = href;
    document.head.appendChild(link);
  } else if (link.sheet) {
    resolve();
  }
})));
const sceneIndex = await (await fetch(UI_DIR + 'scenes-index.json')).json();
await Promise.all(sceneIndex.scenes.map(async ({ contract }) => {
  const sceneContract = await (await fetch(UI_DIR + contract)).json();
  (sceneContract.layers || []).forEach(({ stableId, events = [], texts = [] }) => {
    if (events.some(({ trigger }) => trigger === 'click')) CLICK_EVENT_STABLE_IDS.add(stableId);
    texts.forEach(({ fontFamily, fontWeight }) => {
      if (fontFamily) UI_FONT_SPECS.add(`${fontWeight || 'bold'} 16px ${fontFamily}`);
    });
  });
  const navLabel = sceneContract.navTabBar?.label;
  if (navLabel?.fontFamily && navLabel.fontFamily !== 'inherit') {
    UI_FONT_SPECS.add(`${navLabel.fontWeight || 'bold'} 16px ${navLabel.fontFamily}`);
  }
}));

const economy = new EconomyManager({ storagePrefix: STORAGE_PREFIX, initialCoins: INITIAL_COINS, maxHearts: MAX_HEARTS });
let economyTransactionTail = Promise.resolve();
const economyTransactions = new Map();
const runEconomyTransaction = (key, work) => {
  const existing = economyTransactions.get(key);
  if (existing) return existing;
  const transaction = economyTransactionTail.then(work);
  economyTransactionTail = transaction.catch(() => {});
  const settled = transaction.finally(() => economyTransactions.delete(key));
  economyTransactions.set(key, settled);
  return settled;
};
if (economy.getCoins() === 0 && localStorage.getItem(INITIAL_COIN_GRANT_STORAGE_KEY) == null) {
  await runEconomyTransaction('initial-coin-migration', () => economy.grantCoins(INITIAL_COINS, 'initial-coin-migration'));
  localStorage.setItem(INITIAL_COIN_GRANT_STORAGE_KEY, '1');
}
const progress = new ProgressManager({ storagePrefix: STORAGE_PREFIX });
const sound = new SoundManager({ storagePrefix: STORAGE_PREFIX });
const flow = new FlowDriver({
  basePath: ASSET_BASE,
  dataPath: UI_DIR,
  managers: { economy, progress },
});

let hasUserGesture = false;
let lobbyBgmEnabled = true;
let ingameBgmEnabled = true;
let buttonSfxEnabled = true;
let hapticsEnabled = true;
let unlimitedHeartsTimeoutId = null;
let shopPurchasePending = false;

function hasUnlimitedHearts() {
  return Number(localStorage.getItem(UNLIMITED_HEARTS_STORAGE_KEY)) > Date.now();
}

function syncUnlimitedHearts(renderer = null) {
  const unlimitedHeartsActive = hasUnlimitedHearts();
  const heartImage = {
    event: { heart: { active: unlimitedHeartsActive ? EVENT_HEART_ICON : DEFAULT_HEART_ICON } },
  };
  flow.update(heartImage);
  const lobbyRenderer = renderer || flow.current?.renderer?.getActiveTabRenderer();
  lobbyRenderer?.update(heartImage);
  const heartCount = lobbyRenderer?.getElement('icon-heart-png-2285')?.querySelector('span');
  if (heartCount) heartCount.style.visibility = unlimitedHeartsActive ? 'hidden' : '';
  if (unlimitedHeartsTimeoutId != null) clearTimeout(unlimitedHeartsTimeoutId);
  if (unlimitedHeartsActive) {
    unlimitedHeartsTimeoutId = setTimeout(syncUnlimitedHearts, Number(localStorage.getItem(UNLIMITED_HEARTS_STORAGE_KEY)) - Date.now() + 1);
  }
  return unlimitedHeartsActive;
}

function activateUnlimitedHearts() {
  localStorage.setItem(UNLIMITED_HEARTS_STORAGE_KEY, String(Date.now() + UNLIMITED_HEARTS_DURATION_MS));
  syncUnlimitedHearts();
}

function formatShopCooldown(ms) {
  const totalSeconds = Math.max(0, Math.ceil(ms / 1000));
  const hours = Math.floor(totalSeconds / 3600);
  const minutes = Math.floor((totalSeconds % 3600) / 60);
  const seconds = totalSeconds % 60;
  return [hours, minutes, seconds].map(v => String(v).padStart(2, '0')).join(':');
}

function getShopCooldownRemaining(productKey) {
  return Math.max(0, (Number(localStorage.getItem(SHOP_COOLDOWN_STORAGE_PREFIX + productKey)) || 0) - Date.now());
}

function setShopCooldown(productKey) {
  localStorage.setItem(SHOP_COOLDOWN_STORAGE_PREFIX + productKey, String(Date.now() + SHOP_PRODUCTS[productKey].cooldownMs));
}

function syncShopCooldowns(renderer) {
  Object.entries(SHOP_PRODUCTS).forEach(([productKey, product]) => {
    const remaining = getShopCooldownRemaining(productKey);
    product.active.forEach(stableId => {
      const el = renderer.getElement(stableId);
      if (el) el.style.display = remaining > 0 ? 'none' : '';
    });
    product.off.forEach(stableId => {
      const el = renderer.getElement(stableId);
      if (el) el.style.display = remaining > 0 ? '' : 'none';
    });
    const timer = renderer.getTextElement(product.timerText, 0);
    if (timer) {
      timer.textContent = formatShopCooldown(remaining);
      if (timer.dataset.gradText !== undefined) timer.dataset.gradText = timer.textContent;
    }
  });
}

sound.unlockOnFirstGesture(() => {
  // 첫 터치 안에서 BGM을 시작해야 브라우저의 자동 재생 차단을 피할 수 있다.
  // 로비 진입은 navigation 호스트를 거치므로 scene:enter 시점까지 기다리지 않는다.
  if (lobbyBgmEnabled) sound.playBgm(LOBBY_BGM);
  // 비동기 Godot progress 이벤트의 SFX도 재생되도록, 사용자 제스처 안에서
  // 무음 SFX를 한 번 재생해 브라우저의 미디어 권한을 해제한다.
  sound.playKeyedSfx('audio-unlock', BUTTON_CLICK_SFX, 0);
  hasUserGesture = true;
});
document.addEventListener('click', event => {
  const isLoadingBar = event.target instanceof Element
    && !!event.target.closest('[data-stable-id="loading-out-png-11"]');
  if (loadingReady && activeSceneUuid === SPLASH_UI_SCENE_UUID && !isLoadingBar) {
    splashRenderer?.getElement('loading-out-png-11')?.click();
    return;
  }
  const isLobbyStageButton = event.target instanceof Element
    && !!event.target.closest('[data-stable-id="home-btn-stage-normal-png-145"]');
  const isNavTab = event.target instanceof Element
    && !!event.target.closest('[data-nav-tab]');
  if (buttonSfxEnabled && (isLobbyStageButton || isNavTab)) sound.playSfx(BUTTON_CLICK_SFX);
  if (isLobbyStageButton && economy.getHearts() === 0 && !hasUnlimitedHearts()) {
    event.preventDefault();
    event.stopImmediatePropagation();
    flow.current?.renderer?.getActiveTabRenderer()?.getElement('home-btn-plus-png-94')?.click();
    return;
  }
  if (buttonSfxEnabled && !isLobbyStageButton && !isNavTab && event.target instanceof Element) {
    let clickEventElement = event.target;
    while (clickEventElement != null) {
      if (CLICK_EVENT_STABLE_IDS.has(clickEventElement.dataset.stableId)) {
        sound.playSfx(BUTTON_CLICK_SFX);
        break;
      }
      clickEventElement = clickEventElement.parentElement;
    }
  }
  if (hapticsEnabled && event.target instanceof Element && event.target.closest('[data-stable-id]')) navigator.vibrate?.(12);
}, { capture: true });

let loadingReady = false;
flow.defineCondition('로딩', () => loadingReady);
flow.defineCondition('not max_heart', () => economy.getHearts() < economy.maxHearts);
flow.defineCondition('no_heart', () => economy.getHearts() === 0 && !hasUnlimitedHearts());
const godotCartridge = makeGodotCartridge({
  engineUrl: GODOT_ENGINE_URL,
  engineConfig: GODOT_CONFIG,
});
let activeGame = null;
let activeSceneName = '';
let activeSceneUuid = '';
let splashRenderer = null;
let continueWithoutHeart = false;
let endedGame = null;
let sceneSessionToken = 0;
let instantLobbyHomeReturnTimeoutId = null;
let activeGodotScene = 'lobby';
let currentMapStage = progress.getCurrentStage();
const itemCounts = { remove: ITEM_START_COUNT, timestop: ITEM_START_COUNT, move: ITEM_START_COUNT };
const itemPending = { remove: 0, timestop: 0, move: 0 };
let selectedTargetItem = null;

function syncItemCounts() {
  flow.update({
    item1: selectedTargetItem === 'remove',
    itme3: selectedTargetItem === 'move',
    item: {
      remove: { current: itemCounts.remove },
      timestop: { current: itemCounts.timestop },
      move: { current: itemCounts.move },
      cancle: selectedTargetItem ? 'X' : '',
    },
  });
}

function resetItemCounts() {
  Object.keys(itemCounts).forEach(item => { itemCounts[item] = ITEM_START_COUNT; itemPending[item] = 0; });
  selectedTargetItem = null;
  syncItemCounts();
}

function requestItem(item) {
  if (activeGame?.state !== 'running' || itemCounts[item] <= itemPending[item] || (item !== 'timestop' && selectedTargetItem)) return;
  itemPending[item] += 1;
  if (item !== 'timestop') selectedTargetItem = item;
  syncItemCounts();
  activeGame.message(`item.${item}`, {});
}

function cancelItemSelection() {
  if (!selectedTargetItem || activeGame?.state !== 'running') return;
  activeGame.message('item.cancel', { item: selectedTargetItem });
}

let pendingSceneReady = null;
const handleGodotSfx = ({ sfx, outcome, score, stage, sceneReady, itemUsed, itemRejected }) => {
  if (sceneReady && pendingSceneReady?.scene === sceneReady) pendingSceneReady.resolve();
  if (sfx === 'cat-mouth-open' && hasUserGesture && buttonSfxEnabled) sound.playKeyedSfx('cat-mouth-open', CAT_MOUTH_SFX);
  if (sfx === 'cat-move' && buttonSfxEnabled) sound.playSfx(CAT_MOVE_SFX);
  if (sfx === 'ice-break' && buttonSfxEnabled) sound.playSfx(ICE_BREAK_SFX);
  if (sfx === 'ice-freezing' && buttonSfxEnabled) sound.playSfx(ICE_FREEZING_SFX);
  if (sfx === 'digging' && buttonSfxEnabled) sound.playSfx(DIGGING_SFX);
  if (sfx === 'cat-hole-absorb') {
    if (buttonSfxEnabled) sound.playKeyedSfx('cat-hole-absorb', CAT_HOLE_ABSORB_SFX);
  }
  if (sfx === 'item-move-hole-pop' && buttonSfxEnabled) sound.playSfx(ITEM_MOVE_HOLE_POP_SFX);
  if (activeSceneName === INGAME_UI_SCENE && Number.isInteger(stage) && stage > 0) {
    currentMapStage = stage;
    resetItemCounts();
    flow.update({ stage: { current: `Level${stage}` } });
  }
  if (itemUsed) {
    itemPending[itemUsed] = Math.max(0, itemPending[itemUsed] - 1);
    itemCounts[itemUsed] = Math.max(0, itemCounts[itemUsed] - 1);
    if (selectedTargetItem === itemUsed) selectedTargetItem = null;
    syncItemCounts();
  }
  if (itemRejected) {
    itemPending[itemRejected] = Math.max(0, itemPending[itemRejected] - 1);
    if (selectedTargetItem === itemRejected) selectedTargetItem = null;
    syncItemCounts();
  }
  if (outcome === 'clear' || outcome === 'fail') void handleMainGameEnd({ outcome, score, stats: {} }).catch(error => console.error('[Godot] stage-end 처리 실패', error));
};

const handleMainGameEnd = async (result) => {
  if (endedGame === activeGame) return;
  endedGame = activeGame;
  if (result.outcome === 'clear') {
    await runEconomyTransaction('stage-clear', async () => {
      await economy.grantHearts(1);
      await economy.grantCoins(STAGE_CLEAR_REWARD, 'stage-clear');
    });
    await progress.recordClear(currentMapStage, {
      stars: result.stats?.stars || 0,
      score: result.score,
      ticket: result.ticket,
    });
    await flow.fire('스테이지 클리어시');
  } else if (result.outcome === 'fail') {
    await flow.fire('스테이지 시간이 다되어 게임패배시');
  }
};

flow.defineCondition('not enough coin', () => runEconomyTransaction('coin-gated-action', async () => {
  if (economy.getCoins() < COIN_COST) return true;
  const reason = activeSceneName === 'pop_OutOfMoves' ? 'out-of-moves-continue' : 'buy-lives-900';
  if (!(await economy.spendCoins(COIN_COST, reason))) return true;
  if (activeSceneName === 'pop_OutOfMoves') continueWithoutHeart = true;
  else await economy.grantHearts(1);
  return false;
}));

flow.update({
  loading: { prograss: 0 },
  loadingMessage: 'Loading... 0%',
  cost: { refill: String(COIN_COST) },
  continue: { coin: String(COIN_COST) },
  stage: { timer: '01:00' },
});
syncItemCounts();
syncUnlimitedHearts();
// pop_BuyCoins is intentionally used both as a navigation tab and as an overlay popup.

flow.on('scene:enter', ({ sceneUuid, sceneName, renderer, popup, waitUntil }) => {
  const enterWork = (async () => {
  if (!popup && sceneUuid === LOBBY_NAV_SCENE_UUID) {
    document.body.classList.add('instant-lobby-home-return');
    clearTimeout(instantLobbyHomeReturnTimeoutId);
    document.addEventListener('pointerdown', () => {
      document.body.classList.remove('instant-lobby-home-return');
      clearTimeout(instantLobbyHomeReturnTimeoutId);
      instantLobbyHomeReturnTimeoutId = null;
    }, { capture: true, once: true });
    instantLobbyHomeReturnTimeoutId = setTimeout(() => {
      document.body.classList.remove('instant-lobby-home-return');
      instantLobbyHomeReturnTimeoutId = null;
    }, 10000);
  }
  activeSceneName = sceneName;
  activeSceneUuid = sceneUuid;
  if (sceneName === LOBBY_UI_SCENE || sceneUuid === LOBBY_NAV_SCENE_UUID) syncUnlimitedHearts(renderer);
  if (sceneName === LOBBY_UI_SCENE) renderer.update({ stage: { current: `Level${currentMapStage}` } });
  if ((sceneName === LOBBY_UI_SCENE || sceneUuid === LOBBY_NAV_SCENE_UUID) && lobbyBgmEnabled) sound.playBgm(LOBBY_BGM);
  if (sceneName === INGAME_UI_SCENE) {
    renderer.update({ stage: { current: `Level${currentMapStage}` } });
    syncItemCounts();
    renderer.on('entry-box-normal-png-2455:click', () => requestItem('remove'));
    renderer.on('entry-box-normal-png-2456:click', () => requestItem('timestop'));
    renderer.on('entry-box-normal-png-2457:click', () => requestItem('move'));
    renderer.on('entry-box-normal-png-2468:click', cancelItemSelection);
    renderer.on('entry-box-normal-png-2471:click', cancelItemSelection);
    if (ingameBgmEnabled) sound.playBgm(INGAME_BGM);
    else sound.stopBgm();
  }
  if (sceneName === 'pop_BuyCoins') {
    const purchaseToast = renderer.getElement('common-box-toast-png-2187');
    let purchaseToastTimer;
    if (purchaseToast) purchaseToast.style.visibility = 'hidden';
    syncShopCooldowns(renderer);
    const shopCooldownAnchor = renderer.getElement('plain-text-50');
    const shopCooldownTimer = setInterval(() => {
      if (!shopCooldownAnchor?.isConnected) {
        clearInterval(shopCooldownTimer);
        return;
      }
      syncShopCooldowns(renderer);
    }, 1000);
    const showPurchaseToast = () => {
      if (!purchaseToast) return;
      clearTimeout(purchaseToastTimer);
      purchaseToast.style.visibility = '';
      purchaseToastTimer = setTimeout(() => { purchaseToast.style.visibility = 'hidden'; }, 2500);
    };
    renderer.on('860', async () => {
      if (shopPurchasePending || getShopCooldownRemaining('860') > 0) return;
      shopPurchasePending = true;
      try {
        await runEconomyTransaction('shop-purchase', async () => {
          await economy.grantCoins(5000, 'shop-860');
          await economy.refillHearts();
          activateUnlimitedHearts();
        });
        setShopCooldown('860');
        syncShopCooldowns(renderer);
        showPurchaseToast();
      } finally {
        shopPurchasePending = false;
      }
    });
    renderer.on('480', async () => {
      if (shopPurchasePending || getShopCooldownRemaining('480') > 0) return;
      shopPurchasePending = true;
      try {
        await runEconomyTransaction('shop-purchase', async () => {
          await economy.grantCoins(2500, 'shop-480');
          await economy.grantHearts(10, Date.now(), 'shop-480', { overflowCap: 10 });
        });
        setShopCooldown('480');
        syncShopCooldowns(renderer);
        showPurchaseToast();
      } finally {
        shopPurchasePending = false;
      }
    });
    renderer.on('320', async () => {
      if (shopPurchasePending || getShopCooldownRemaining('320') > 0) return;
      shopPurchasePending = true;
      try {
        await runEconomyTransaction('shop-purchase', () => economy.grantCoins(1000, 'shop-320'));
        setShopCooldown('320');
        syncShopCooldowns(renderer);
        showPurchaseToast();
      } finally {
        shopPurchasePending = false;
      }
    });
  }
  if (sceneName === 'pop_LevelWin' && popup) {
    if (buttonSfxEnabled) {
      sound.playSfx(STAGE_CLEAR1_SFX);
      setTimeout(() => sound.playSfx(STAGE_CLEAR2_SFX), STAGE_CLEAR2_DELAY_MS);
    }
    renderer.getElement('confetti-148')?.style.setProperty('pointer-events', 'none');
    renderer.getElement('confetti-148')?.closest('.sr-fit')?.style.setProperty('z-index', '9001');
    if (activeGame?.state === 'running') activeGame.pause('level-win');
    activeGame?.message('load_scene', {
      stage: progress.getCurrentStage(),
      config: { godotScene: 'main', timeLimitSeconds: STAGE_TIME_LIMIT_SECONDS },
    });
  }
  if (sceneName === 'pop_OutOfMoves' && popup) {
    if (buttonSfxEnabled) sound.playSfx(TIME_OUT_SFX);
    if (activeGame?.state === 'running') activeGame.pause('out-of-moves');
  } else if (sceneName === 'pop_Give_up' && popup) {
    if (activeGame?.state === 'running') activeGame.pause('give-up');
    ['plain-text-2382:click', 'common-btn-top-x-red-png-2384:click'].forEach(eventName => {
      renderer.on(eventName, () => activeGame?.resume());
    });
  } else if (popup && buttonSfxEnabled) {
    sound.playSfx(POPUP_OPEN_SFX);
  }
  if ((sceneName === 'pop_Settings_1' || sceneName === 'pop_Settings') && popup) {
    if (activeGame?.state === 'running') activeGame.pause('settings');
    renderer.update({
      sound: sceneName === 'pop_Settings' ? buttonSfxEnabled : ingameBgmEnabled,
      music: sceneName === 'pop_Settings' ? lobbyBgmEnabled : buttonSfxEnabled,
      vibration: hapticsEnabled,
    });
    renderer.on('widget:sound', ({ value }) => {
      if (sceneName === 'pop_Settings') {
        buttonSfxEnabled = !!value;
        if (!buttonSfxEnabled) {
          sound.stopSfx('cat-mouth-open');
          sound.stopSfx('cat-hole-absorb');
        }
        renderer.update({ sound: buttonSfxEnabled });
      } else {
        ingameBgmEnabled = !!value;
        if (ingameBgmEnabled) sound.playBgm(INGAME_BGM);
        else sound.stopBgm();
        renderer.update({ sound: ingameBgmEnabled });
      }
    });
    renderer.on('widget:music', ({ value }) => {
      if (sceneName === 'pop_Settings') {
        lobbyBgmEnabled = !!value;
        if (lobbyBgmEnabled) sound.playBgm(LOBBY_BGM);
        else sound.stopBgm();
        renderer.update({ music: lobbyBgmEnabled });
      } else {
        buttonSfxEnabled = !!value;
        if (!buttonSfxEnabled) sound.stopSfx('cat-mouth-open');
        renderer.update({ music: buttonSfxEnabled });
      }
    });
    renderer.on('widget:vibration', ({ value }) => {
      hapticsEnabled = !!value;
      if (hapticsEnabled) navigator.vibrate?.(12);
      else navigator.vibrate?.(0);
      renderer.update({ vibration: hapticsEnabled });
    });
    const menuMotionTargets = sceneName === 'pop_Settings_1'
      ? SETTINGS_MENU_GROUPS.map(({ name, offset, layerIds }) => ({
          offset,
          targets: layerIds
            ? layerIds.map(stableId => renderer.getElement(stableId)).filter(Boolean)
            : [renderer.getGroup(name)].filter(Boolean),
        }))
      : [];
    ['entry-box-normal-png-2287', 'home-btn-setting-webp-2288'].forEach(stableId => {
      const closeButton = renderer.getElement(stableId);
      if (!closeButton) return;
      ['mousedown', 'mouseup', 'mouseleave', 'touchstart', 'touchend'].forEach(eventName => {
        closeButton.addEventListener(eventName, event => event.stopPropagation());
      });
    });
    const popupSettingsFx = renderer.getElement('entry-box-normal-png-2287')?.closest('[data-fx-group]');
    const popupSettingsGroup = renderer.getGroup('setting');
    menuMotionTargets.forEach(({ offset, targets }, index) => {
      const translate = `translateY(${offset}px)`;
      targets.forEach(target => {
        target.style.transform = translate;
        target.animate(
          [{ transform: translate }, { transform: 'translateY(0)' }],
          {
            duration: SETTINGS_MENU_MOTION_MS,
            delay: index * SETTINGS_MENU_STAGGER_MS,
            easing: 'cubic-bezier(0.22, 1, 0.36, 1)',
            fill: 'forwards',
          },
        );
      });
    });
    renderer.on('entry-box-normal-png-2287:click', () => {
      popupSettingsFx?.animate(
        [
          { transform: 'scale(1)', filter: 'brightness(1)' },
          { transform: 'scale(.95)', filter: 'brightness(.95)' },
          { transform: 'scale(1)', filter: 'brightness(1)' },
        ],
        { duration: 100, easing: 'ease-out' },
      );
      [...menuMotionTargets].reverse().forEach(({ offset, targets }, index) => {
        targets.forEach(target => target.animate(
          [{ transform: 'translateY(0)' }, { transform: `translateY(${offset}px)` }],
          {
            duration: SETTINGS_MENU_MOTION_MS,
            delay: index * SETTINGS_MENU_STAGGER_MS,
            easing: 'cubic-bezier(0.4, 0, 1, 1)',
            fill: 'forwards',
          },
        ));
      });
      setTimeout(() => {
        menuMotionTargets.forEach(({ targets }) => {
          targets.forEach(target => target.style.setProperty('visibility', 'hidden'));
        });
        popupSettingsGroup?.style.setProperty('visibility', 'hidden');
      }, SETTINGS_MENU_MOTION_MS + SETTINGS_MENU_STAGGER_MS * (SETTINGS_MENU_GROUPS.length - 1));
      setTimeout(() => flow.goto(INGAME_UI_SCENE), SETTINGS_MENU_MOTION_MS + SETTINGS_MENU_STAGGER_MS * SETTINGS_MENU_GROUPS.length + 20);
    });
    return;
  }
  if (sceneName === INGAME_UI_SCENE) {
    renderer.getGroup('setting')?.style.removeProperty('visibility');
  }
  if (sceneUuid === SPLASH_UI_SCENE_UUID) {
    splashRenderer = renderer;
    renderer.getElementByName('GameField')?.style.setProperty('visibility', 'hidden');
    await uiRenderStylesReady;
    if (splashCache) {
      await Promise.all([
        fetch(GODOT_ENGINE_URL),
        fetch(`${GODOT_CONFIG.executable}.wasm`),
        fetch(GODOT_CONFIG.mainPack || `${GODOT_CONFIG.executable}.pck`),
      ]);
    }
    if (document.fonts?.load && UI_FONT_SPECS.size) {
      await Promise.all([...UI_FONT_SPECS].map(spec => document.fonts.load(spec).catch(() => null)));
    }
    const game = new GameSession({ renderer, initTimeoutMs: 30000 });
    activeGame = game;
    await game.start(godotCartridge, {
      stage: progress.getCurrentStage(),
      config: { godotScene: 'lobby', preloadGodotScenes: ['main'] },
      onProgress: handleGodotSfx,
      onHud: ({ timeLeft }) => flow.update({ stage: { timer: timeLeft } }),
      onEnd: handleMainGameEnd,
      onError: (error) => console.error('[Godot preload] session error', error),
    });
    if (activeGame !== game || game.state !== 'ready') {
      throw new Error('[Godot preload] Lobby/Main 준비에 실패했습니다.');
    }
    const gameHost = document.getElementById('godot-bridge-canvas')?.parentElement;
    const parking = document.getElementById('godot-bridge-parking') || document.createElement('div');
    parking.id = 'godot-bridge-parking';
    parking.style.cssText = 'display:none;';
    if (!parking.isConnected) document.body.appendChild(parking);
    if (gameHost) parking.appendChild(gameHost);
    loadingReady = true;
    const fillStartedAt = performance.now();
    while (true) {
      const percent = Math.min(100, Math.round((performance.now() - fillStartedAt) / SPLASH_LOAD_FILL_DURATION_MS * 100));
      flow.update({ loading: { prograss: percent }, loadingMessage: `Loading... ${percent}%` });
      if (percent === 100) break;
      await new Promise(resolve => requestAnimationFrame(resolve));
    }
    flow.update({ loadingMessage: 'Tap to screen' });
    return;
  }
  const godotScene = sceneName === LOBBY_UI_SCENE ? 'lobby'
    : sceneName === INGAME_UI_SCENE ? 'main' : null;
  const gameHost = document.getElementById('godot-bridge-canvas')?.parentElement;
  const parking = document.getElementById('godot-bridge-parking');
  if (!godotScene) {
    if (!popup && gameHost && parking) parking.appendChild(gameHost);
    return;
  }
  const gameField = renderer.getElementByName('GameField');
  if (gameHost && gameField) {
    gameHost.style.cssText = 'position:absolute;inset:0;overflow:hidden;display:block;';
    gameField.appendChild(gameHost);
  }
  if (activeGame?.state === 'running' && godotScene === activeGodotScene) return;
  if (activeGame?.state === 'running') activeGame.pause('scene-switch');
  if (activeGame?.state === 'paused') {
    if (godotScene === 'main') endedGame = null;
    if (godotScene === 'main' && continueWithoutHeart) {
      activeGame.message('continue_stage', { timeLimitSeconds: STAGE_TIME_LIMIT_SECONDS });
      continueWithoutHeart = false;
    }
    if (godotScene !== activeGodotScene) {
      activeGodotScene = godotScene;
      activeGame.message('load_scene', {
        stage: progress.getCurrentStage(),
        config: { godotScene, ...(godotScene === 'main' ? { timeLimitSeconds: STAGE_TIME_LIMIT_SECONDS } : {}) },
      });
    }
    activeGame.resume();
    return;
  }
  if (activeGame?.state === 'ready') {
    if (godotScene === activeGodotScene) return;
    if (godotScene === 'main') {
      if (!continueWithoutHeart && !hasUnlimitedHearts() && !(await runEconomyTransaction('game-entry-heart', () => economy.consumeHeart()))) {
        throw new Error('[Economy] Ingame 진입 전 하트 소비에 실패했습니다. no_heart 흐름도 분기를 확인하세요.');
      }
      continueWithoutHeart = false;
      const sceneReadyPromise = new Promise(resolve => {
        pendingSceneReady = { scene: godotScene, resolve: () => { pendingSceneReady = null; resolve(); } };
      });
      activeGame.message('load_scene', {
        stage: currentMapStage,
        config: { godotScene, timeLimitSeconds: STAGE_TIME_LIMIT_SECONDS },
      });
      activeGodotScene = godotScene;
      activeGame.startGame();
      await sceneReadyPromise;
      return;
    }
  }
  const sessionToken = ++sceneSessionToken;

  if (godotScene === 'main' && !continueWithoutHeart && !hasUnlimitedHearts()) {
    const consumedHeart = await runEconomyTransaction('game-entry-heart', () => economy.consumeHeart());
    if (sessionToken !== sceneSessionToken) return;
    if (!consumedHeart) {
      throw new Error('[Economy] Ingame 진입 전 하트 소비에 실패했습니다. no_heart 흐름도 분기를 확인하세요.');
    }
  }
  if (sessionToken !== sceneSessionToken) return;
  continueWithoutHeart = false;

  if (activeGame) activeGame.abort('scene-change');
  const game = new GameSession({ renderer, initTimeoutMs: 30000, hudMap: { timeLeft: 'stage.timer' } });
  activeGame = game;
  activeGodotScene = godotScene;
  await game.start(godotCartridge, {
    stage: currentMapStage,
    config: { godotScene, ...(godotScene === 'main' ? { timeLimitSeconds: STAGE_TIME_LIMIT_SECONDS } : {}) },
    onEnd: handleMainGameEnd,
    onProgress: handleGodotSfx,
    onError: (error) => console.error('[Godot integration] session error', error),
  });
  if (sessionToken !== sceneSessionToken || activeGame !== game) {
    game.abort('stale-scene-enter');
    return;
  }
  if (game.state === 'ready') game.startGame();
  })();
  waitUntil?.(enterWork);
});

await flow.start();
</script>

</html>
