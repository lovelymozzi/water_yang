<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>$GODOT_PROJECT_NAME</title>
$GODOT_HEAD_INCLUDE
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden}</style>
</head>
<body>
<script type="module">
const UI_DIR = './ui/';
const ASSET_BASE = '../';
const STORAGE_PREFIX = 'leonout_';
const INGAME_UI_SCENE = 'Ingame';
const COIN_COST = 900;
const STAGE_TIME_LIMIT_SECONDS = 60;
const GODOT_ENGINE_URL = "$GODOT_URL";
const GODOT_CONFIG = $GODOT_CONFIG;

import { FlowDriver } from './ui/flow-driver.js';
import { EconomyManager } from './ui/economy-manager.js';
import { ProgressManager } from './ui/progress-manager.js';
import { GameSession } from './ui/game-session.js';
import { makeGodotCartridge } from './ui/godot-bridge.js';

const economy = new EconomyManager({ storagePrefix: STORAGE_PREFIX });
const progress = new ProgressManager({ storagePrefix: STORAGE_PREFIX });
const flow = new FlowDriver({
  basePath: ASSET_BASE,
  dataPath: UI_DIR,
  managers: { economy, progress },
});

flow.defineCondition('current stage>4', () => progress.getCurrentStage() > 4);
flow.defineCondition('not max_heart', () => economy.getHearts() < economy.maxHearts);
flow.defineCondition('no_heart', () => economy.getHearts() === 0);
flow.defineCondition('900코인 소모 후 하트풀충전', async () => {
  if (!(await economy.spendCoins(COIN_COST, 'heart-refill'))) return false;
  await economy.refillHearts();
  return true;
});
flow.defineCondition('광고호출 후 하트1개 충전', async () => {
  // TODO(ad-sdk): reward verification callback must replace this local fallback before release.
  alert('ad complete');
  await economy.grantHearts(1);
  return true;
});

const godotCartridge = makeGodotCartridge({
  engineUrl: GODOT_ENGINE_URL,
  engineConfig: GODOT_CONFIG,
});
let activeGame = null;
let activeSceneName = '';
let continueWithoutHeart = false;

flow.defineCondition('not enough coin', async () => {
  if (economy.getCoins() < COIN_COST) return true;
  if (activeSceneName !== 'pop_OutOfMoves') return false;
  if (!(await economy.spendCoins(COIN_COST, 'out-of-moves-continue'))) return true;
  continueWithoutHeart = true;
  return false;
});

flow.update({ cost: { refill: String(COIN_COST) }, continue: { coin: String(COIN_COST) }, stage: { timer: '01:00' } });
// pop_BuyCoins is intentionally used both as a navigation tab and as an overlay popup.

flow.on('scene:enter', async ({ sceneName, renderer }) => {
  activeSceneName = sceneName;
  if (sceneName !== INGAME_UI_SCENE) return;

  if (!continueWithoutHeart && !(await economy.consumeHeart())) {
    throw new Error('[Economy] Ingame 진입 전 하트 소비에 실패했습니다. no_heart 흐름도 분기를 확인하세요.');
  }
  continueWithoutHeart = false;

  if (activeGame) await activeGame.abort('scene-change');
  const game = new GameSession({ renderer, initTimeoutMs: 30000, hudMap: { timeLeft: 'stage.timer' } });
  activeGame = game;
  await game.start(godotCartridge, {
    stage: progress.getCurrentStage(),
    config: { godotScene: 'main', timeLimitSeconds: STAGE_TIME_LIMIT_SECONDS },
    onEnd: async (result) => {
      if (result.outcome === 'clear') {
        await economy.grantHearts(1);
        await progress.recordClear(progress.getCurrentStage(), {
          stars: result.stats?.stars || 0,
          score: result.score,
          ticket: result.ticket,
        });
        await flow.fire('스테이지 클리어시');
      } else if (result.outcome === 'fail') {
        await flow.fire('스테이지 시간이 다되어 게임패배시');
      }
    },
    onError: (error) => console.error('[Godot integration] session error', error),
  });
  if (game.state === 'ready') game.startGame();
});

await flow.start();
</script>
</body>
</html>
